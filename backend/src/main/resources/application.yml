spring:
  application:
    name: adou-ofd-backend
  main:
    banner-mode: "off"
  lifecycle:
    timeout-per-shutdown-phase: 5s

server:
  address: 127.0.0.1
  port: 0
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

logging:
  level:
    root: WARN
    com.adou.ofd: INFO

adou:
  version: 0.7.1
  ofdrw-version: 2.5.1
  token: ""
