appId: com.adou.ofd
productName: 阿豆OFD
copyright: Copyright © 2026 阿豆OFD
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json
asar: true
# 只保留中文与英文的 Chromium 语言包，其余 50+ 种 .pak 共约 46MB 全部剔除；
# 缺失语言回退到 en-US，界面文案本身由应用提供，不受影响
electronLanguages:
  - zh-CN
  - en-US
extraResources:
  - from: ../backend/target/adou-ofd-backend.jar
    to: backend/adou-ofd-backend.jar
  # jlink 精简运行时，由 npm run jre:build 生成（见 PRD §7）
  - from: ../backend/target/jre
    to: jre
  # Windows 文件类型图标（DefaultIcon 指向 resources/fileicons/*.ico）
  - from: build/fileicons
    to: fileicons
    filter:
      - "*.ico"
  # 应用许可与第三方声明（关于页读取）
  - from: ../THIRD-PARTY-NOTICES.md
    to: notices/THIRD-PARTY-NOTICES.md
  - from: ../PRIVACY.md
    to: notices/PRIVACY.md
  - from: ../LICENSE
    to: notices/LICENSE.txt
  - from: ../licenses
    to: notices/licenses
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  artifactName: 阿豆OFD-${version}-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 阿豆OFD
  deleteAppDataOnUninstall: false
  include: build/installer.nsh
