appId: com.adou.ofd
productName: 阿豆OFD
copyright: Copyright © 2026 阿豆OFD
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json
asar: true
extraResources:
  - from: ../backend/target/adou-ofd-backend.jar
    to: backend/adou-ofd-backend.jar
  # 原型阶段直接内置完整 JDK；M4 改为 jlink 裁剪（见 PRD §7）
  - from: ../.tools/jdk-25
    to: jre
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  artifactName: 阿豆OFD-${version}-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 阿豆OFD
  deleteAppDataOnUninstall: false
