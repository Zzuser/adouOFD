# CNB 云原生构建：官方托管节点为 Linux x64。
# Windows 安装包依赖 Windows 版 JRE（jlink）与 Inno Setup，需在自托管 Windows 节点构建。

main:
  push:
    - name: ci
      runner:
        tags: cnb:arch:amd64
      stages:
        - name: checks
          jobs:
            backend-tests:
              image: maven:3-eclipse-temurin-25
              script: |
                apt-get update
                apt-get install -y --no-install-recommends fonts-noto-cjk
                mvn -B -ntp -f backend/pom.xml test
            desktop-build:
              image: node:24
              script: |
                cd desktop
                npm config set registry https://registry.npmmirror.com
                npm ci --no-audit --no-fund
                npm run build
  pull_request:
    - name: ci
      runner:
        tags: cnb:arch:amd64
      stages:
        - name: checks
          jobs:
            backend-tests:
              image: maven:3-eclipse-temurin-25
              script: |
                apt-get update
                apt-get install -y --no-install-recommends fonts-noto-cjk
                mvn -B -ntp -f backend/pom.xml test
            desktop-build:
              image: node:24
              script: |
                cd desktop
                npm config set registry https://registry.npmmirror.com
                npm ci --no-audit --no-fund
                npm run build
